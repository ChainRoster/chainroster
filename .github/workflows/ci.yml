name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # The app depends on the sibling repo evm-ui via "file:../evm-ui",
      # so both are checked out side by side.
      - uses: actions/checkout@v5
        with:
          path: chainroster

      - uses: actions/checkout@v5
        with:
          repository: gearcat0/evm-ui
          path: evm-ui

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            chainroster/package-lock.json
            evm-ui/package-lock.json

      - name: Build evm-ui
        working-directory: evm-ui
        run: |
          npm ci
          npm run build

      - name: Install dependencies
        working-directory: chainroster
        run: npm ci

      - name: Run tests
        working-directory: chainroster
        run: npm test

      - name: Build
        working-directory: chainroster
        run: npm run build
